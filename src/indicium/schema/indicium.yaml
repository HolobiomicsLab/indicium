id: https://w3id.org/indicium
name: indicium
description: Shared claim/evidence standard — ECO/CiTO/DoCO/FaBiO/SEPIO/PROV-O + Bucur SuperPattern.
prefixes:
  indicium: https://w3id.org/indicium/
  linkml: https://w3id.org/linkml/
  ECO: http://purl.obolibrary.org/obo/ECO_
  IAO: http://purl.obolibrary.org/obo/IAO_
  doco: http://purl.org/spar/doco/
  cito: http://purl.org/spar/cito/
  fabio: http://purl.org/spar/fabio/
  sepio: http://purl.obolibrary.org/obo/SEPIO_
  prov: http://www.w3.org/ns/prov#
  dct: http://purl.org/dc/terms/
  asb: https://asb.holobiomics.org/ns/asb#
  dcat: http://www.w3.org/ns/dcat#
default_prefix: indicium
default_range: string
imports:
  - linkml:types

enums:
  ClaimType:
    permissible_values:
      explicit: {}
      implicit: {}
  SuperPatternQualifier:
    description: 20-term Bucur et al. (K-CAP 2021) qualifier vocabulary.
    permissible_values:
      causes: {}
      prevents: {}
      inhibits: {}
      activates: {}
      increases: {}
      decreases: {}
      correlates_with: {}
      is_associated_with: {}
      predicts: {}
      interacts_with: {}
      produces: {}
      requires: {}
      enables: {}
      treats: {}
      enhances: {}
      reduces: {}
      has_property: {}
      is_part_of: {}
      is_a: {}
      consistent_with: {}
  EvidenceType:
    permissible_values:
      data:        { meaning: ECO:0000006 }
      citation:    { meaning: ECO:0000033 }
      knowledge:   { meaning: ECO:0000302 }
      inference:   { meaning: ECO:0000361 }
      speculation: { meaning: ECO:0000034 }
  SourceType:
    permissible_values:
      text:   { meaning: IAO:0000311 }
      figure: { meaning: doco:Figure }
      table:  { meaning: doco:Table }
      image:  { meaning: IAO:0000536 }
      code:   { meaning: fabio:ComputerProgram }
      data:   { meaning: dcat:Dataset }
  LinkType:
    permissible_values:
      supports:            { meaning: cito:supports }
      disputes:            { meaning: cito:disputes }
      qualifies:           { meaning: cito:qualifies }
      citesForInformation: { meaning: cito:citesForInformation }
  FigureType:
    description: >-
      FaBiO-aligned classification of figure and display item types found in
      scholarly publications. Values map to FaBiO sub-classes of fabio:Figure
      and fabio:Table.
    permissible_values:
      data_plot:   { meaning: fabio:DataPlot }
      graph:       { meaning: fabio:Graph }
      photograph:  { meaning: fabio:Photograph }
      plate:       { meaning: fabio:Plate }
      diagram:     { meaning: fabio:Diagram }
      flowchart:   { meaning: fabio:Flowchart }
      table:       { meaning: fabio:Table }
      generic:     { meaning: fabio:Figure }
  ScriptType:
    description: >-
      Role-based classification of code artefacts in scholarly publications.
      All values map to fabio:ComputerProgram; the enum value itself conveys
      the functional role within the paper's methodology.
    permissible_values:
      analysis:      { meaning: fabio:ComputerProgram }
      visualization: { meaning: fabio:ComputerProgram }
      workflow:      { meaning: fabio:ComputerProgram }
      notebook:      { meaning: fabio:ComputerProgram }
      utility:       { meaning: fabio:ComputerProgram }
      generic:       { meaning: fabio:ComputerProgram }
  DatasetType:
    description: >-
      Content-type classification of data artefacts in scholarly publications.
      Values map to dcat:Dataset; the enum value conveys the domain/format
      category of the data.
    permissible_values:
      tabular:     { meaning: dcat:Dataset }
      sequence:    { meaning: dcat:Dataset }
      spectral:    { meaning: dcat:Dataset }
      image_stack: { meaning: dcat:Dataset }
      network:     { meaning: dcat:Dataset }
      model:       { meaning: dcat:Dataset }
      generic:     { meaning: dcat:Dataset }

slots:
  id:        { identifier: true, slot_uri: dct:identifier }
  context:   { required: true, slot_uri: asb:context }
  subject:   { required: true, slot_uri: asb:subject }
  qualifier: { required: true, range: SuperPatternQualifier, slot_uri: asb:qualifier }
  relation:  { required: true, slot_uri: asb:relation }
  object:    { required: true, slot_uri: asb:object }
  claim_type: { range: ClaimType }
  source_excerpt: {}
  evidence_type: { range: EvidenceType }
  source_type:   { range: SourceType }
  quote: {}
  confidence: { range: float }
  of_source:  { range: Source }
  for_claim:  { range: Claim }
  identifier: { required: true, slot_uri: dct:identifier }
  title:      { slot_uri: dct:title }
  authors:    { multivalued: true }
  license_id: {}
  link_type:  { range: LinkType }
  # Figure-specific slots
  figure_id:        {}
  caption:          {}
  figure_type:      { range: FigureType }
  panel_label:      {}
  page:             { range: integer }
  media_type:       {}
  content_url:      {}
  source_doi:       {}
  is_supplementary: { range: boolean }
  of_figure:        { range: Figure }
  # Script-specific slots
  script_id:        {}
  script_type:      { range: ScriptType }
  language:         {}
  purpose:          {}
  repository_url:   {}
  commit_sha:       {}
  of_script:        { range: Script }
  # DataAsset-specific slots
  asset_id:         {}
  dataset_type:     { range: DatasetType }
  data_format:      {}
  accession:        {}
  repository:       {}
  n_samples:        { range: integer }
  of_dataset:       { range: DataAsset }

classes:
  Claim:
    class_uri: asb:Claim
    description: A scientific claim using the Bucur 5-slot SuperPattern.
    slots:
      - id
      - context
      - subject
      - qualifier
      - relation
      - object
      - claim_type
      - source_excerpt
  Evidence:
    class_uri: sepio:0000002
    description: An evidence line linking a Claim to a Source (SEPIO EvidenceLine).
    slots: [evidence_type, source_type, quote, confidence, of_source, for_claim,
            of_figure, of_script, of_dataset]
  Source:
    class_uri: fabio:Expression
    description: A cited source/paper with stable identity.
    slots: [identifier, title, authors, license_id]
  Figure:
    class_uri: doco:Figure
    description: >-
      A figure, table, or other display item from a scholarly publication.
      Carries optional FaBiO sub-type classification (via figure_type) and
      provenance (source_doi). Linked from Evidence.of_figure when the
      evidence is grounded in a visual artefact rather than a text passage.
    slots:
      - identifier
      - figure_id
      - caption
      - figure_type
      - panel_label
      - page
      - media_type
      - content_url
      - source_doi
      - is_supplementary
    slot_usage:
      identifier:
        required: false
  Script:
    class_uri: fabio:ComputerProgram
    description: >-
      A code artefact (script, notebook, or pipeline) from a scholarly
      publication. Carries role classification (script_type), programming
      language, repository URL, and optional pinned commit. Linked from
      Evidence.of_script when the evidence is grounded in code rather than
      a text passage or figure.
    slots:
      - identifier
      - script_id
      - script_type
      - language
      - purpose
      - repository_url
      - content_url
      - commit_sha
      - source_doi
      - is_supplementary
    slot_usage:
      identifier:
        required: false
  DataAsset:
    class_uri: dcat:Dataset
    description: >-
      A data artefact (dataset, supplementary file, or public repository
      deposit) from a scholarly publication. Carries content-type
      classification (dataset_type), file format, accession number, and
      hosting repository. Linked from Evidence.of_dataset when the evidence
      is grounded in data rather than a text passage.
    slots:
      - identifier
      - asset_id
      - dataset_type
      - data_format
      - accession
      - repository
      - content_url
      - source_doi
      - n_samples
      - is_supplementary
    slot_usage:
      identifier:
        required: false
  CitationLink:
    description: A typed link (CiTO) from a Source to a Claim.
    slots: [of_source, for_claim, link_type]
