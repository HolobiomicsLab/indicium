id: https://w3id.org/indicium
name: indicium
description: Shared claim/evidence standard — ECO/CiTO/DoCO/FaBiO/SEPIO/PROV-O + Bucur SuperPattern.
prefixes:
  indicium: https://w3id.org/indicium/
  linkml: https://w3id.org/linkml/
  ECO: http://purl.obolibrary.org/obo/ECO_
  IAO: http://purl.obolibrary.org/obo/IAO_
  doco: http://purl.org/spar/doco/
  cito: http://purl.org/spar/cito/
  fabio: http://purl.org/spar/fabio/
  sepio: http://purl.obolibrary.org/obo/SEPIO_
  prov: http://www.w3.org/ns/prov#
  dct: http://purl.org/dc/terms/
  asb: https://asb.holobiomics.org/ns/asb#
  dcat: http://www.w3.org/ns/dcat#
  oa: http://www.w3.org/ns/oa#
default_prefix: indicium
default_range: string
imports:
  - linkml:types

enums:
  ClaimType:
    permissible_values:
      explicit: {}
      implicit: {}
  SuperPatternQualifier:
    description: 20-term Bucur et al. (K-CAP 2021) qualifier vocabulary.
    permissible_values:
      causes: {}
      prevents: {}
      inhibits: {}
      activates: {}
      increases: {}
      decreases: {}
      correlates_with: {}
      is_associated_with: {}
      predicts: {}
      interacts_with: {}
      produces: {}
      requires: {}
      enables: {}
      treats: {}
      enhances: {}
      reduces: {}
      has_property: {}
      is_part_of: {}
      is_a: {}
      consistent_with: {}
  EvidenceType:
    permissible_values:
      data:        { meaning: ECO:0000006 }
      citation:    { meaning: ECO:0000033 }
      knowledge:   { meaning: ECO:0000302 }
      inference:   { meaning: ECO:0000361 }
      speculation: { meaning: ECO:0000034 }
  SourceType:
    permissible_values:
      text:   { meaning: IAO:0000311 }
      figure: { meaning: doco:Figure }
      table:  { meaning: doco:Table }
      image:  { meaning: IAO:0000536 }
      code:   { meaning: fabio:ComputerProgram }
      data:   { meaning: dcat:Dataset }
  ClaimStatus:
    description: Lifecycle state of a Claim.
    permissible_values:
      draft:      {}
      verified:   {}
      published:  {}
      retracted:  {}
      superseded: {}
  LinkType:
    permissible_values:
      supports:            { meaning: cito:supports }
      disputes:            { meaning: cito:disputes }
      qualifies:           { meaning: cito:qualifies }
      citesForInformation: { meaning: cito:citesForInformation }
      contradicts:         { meaning: cito:contradicts }
      refines:             { meaning: cito:refines }
      extends:             { meaning: cito:extends }
      agreesWith:          { meaning: cito:agreesWith }
      disagreesWith:       { meaning: cito:disagreesWith }
      updates:             { meaning: cito:updates }
      corrects:            { meaning: cito:corrects }
      usesDataFrom:        { meaning: cito:usesDataFrom }
      usesMethodIn:        { meaning: cito:usesMethodIn }
  FigureType:
    description: >-
      FaBiO-aligned classification of figure and display item types found in
      scholarly publications. Values map to FaBiO sub-classes of fabio:Figure
      and fabio:Table.
    permissible_values:
      data_plot:   { meaning: fabio:DataPlot }
      graph:       { meaning: fabio:Graph }
      photograph:  { meaning: fabio:Photograph }
      plate:       { meaning: fabio:Plate }
      diagram:     { meaning: fabio:Diagram }
      flowchart:   { meaning: fabio:Flowchart }
      table:       { meaning: fabio:Table }
      generic:     { meaning: fabio:Figure }
  ScriptType:
    description: >-
      Role-based classification of code artefacts in scholarly publications.
      All values map to fabio:ComputerProgram; the enum value itself conveys
      the functional role within the paper's methodology.
    permissible_values:
      analysis:      { meaning: fabio:ComputerProgram }
      visualization: { meaning: fabio:ComputerProgram }
      workflow:      { meaning: fabio:ComputerProgram }
      notebook:      { meaning: fabio:ComputerProgram }
      utility:       { meaning: fabio:ComputerProgram }
      generic:       { meaning: fabio:ComputerProgram }
  DatasetType:
    description: >-
      Content-type classification of data artefacts in scholarly publications.
      Values map to dcat:Dataset; the enum value conveys the domain/format
      category of the data.
    permissible_values:
      tabular:     { meaning: dcat:Dataset }
      sequence:    { meaning: dcat:Dataset }
      spectral:    { meaning: dcat:Dataset }
      image_stack: { meaning: dcat:Dataset }
      network:     { meaning: dcat:Dataset }
      model:       { meaning: dcat:Dataset }
      generic:     { meaning: dcat:Dataset }
  EcoCodeAsbSubset:
    description: >-
      ASB-emitted subset of the Evidence Code Ontology (ECO). The full ECO
      is large; ASB only emits these 8 values. Downstream consumers can
      treat this as a closed enum for ASB-sourced Evidence records.
    permissible_values:
      textual_quotation:
        meaning: ECO:0000033
        description: Verbatim quote from a paper. ASB default.
      computational_evidence:
        meaning: ECO:0000251
        description: Derived from code execution or pipeline output.
      expert_curation:
        meaning: ECO:0000305
        description: Hand-curated by a domain expert.
      inference_from_background_knowledge:
        meaning: ECO:0000302
        description: LLM-asserted from prior knowledge (no direct paper trace).
      author_statement:
        meaning: ECO:0000204
        description: Stated by authors but not directly quoted.
      experimental_evidence:
        meaning: ECO:0000006
        description: Generated by wet-lab experiment described in the paper.
      combinatorial_evidence:
        meaning: ECO:0000213
        description: Multi-method aggregate (e.g. spectral + retention time).
      traceable_author_statement:
        meaning: ECO:0000033
        description: Author statement with explicit textual trace (DOI + paragraph).

slots:
  id:        { identifier: true, slot_uri: dct:identifier }
  context:   { required: true, slot_uri: asb:context }
  subject:   { required: true, slot_uri: asb:subject }
  qualifier: { required: false, range: SuperPatternQualifier, slot_uri: asb:qualifier }
  super_pattern:
    required: false
    range: SuperPatternQualifier
    slot_uri: asb:qualifier
    aliases: [qualifier]
    description: >-
      Spec-required name for the Bucur SuperPattern qualifier. Aliases
      `qualifier`; the ASB adapter targets this name. Either may be set;
      both must agree if both are populated.
  domain_qualifier:
    required: false
    range: string
    pattern: "^[a-z][a-z0-9_]*$"
    slot_uri: asb:domainQualifier
    description: >-
      Open-vocabulary qualifier contributed by a DomainAdapter
      (indicium-adapters), e.g. 'aligned_with' or 'differentially_expressed_in'.
      This is NOT the closed Bucur SuperPattern — values are snake_case domain
      terms. A Claim must carry at least one of {qualifier, domain_qualifier}
      (enforced by the supplemental QualifierPresenceShape, since `qualifier`
      itself is no longer required at the slot level).
  relation:  { required: true, slot_uri: asb:relation }
  predicate:
    required: false
    slot_uri: asb:relation
    aliases: [relation]
    description: >-
      Spec-required name for the CiTO/SEPIO predicate. Shares slot_uri
      with `relation`; ASB adapter targets this name. Either may be set;
      they MUST agree if both are populated (enforced by downstream
      adapter, not at schema level).
  object:    { required: true, slot_uri: asb:object }
  claim_type: { range: ClaimType }
  source_excerpt: {}
  evidence_type: { range: EvidenceType }
  source_type:   { range: SourceType }
  quote: {}
  quote_exact:
    required: false
    aliases: [quote]
    description: >-
      Spec-required name for the verbatim text excerpt supporting a claim.
      Aliases `quote`; ASB adapter targets this name. SHACL-level constraint
      that exactly one of {quote, quote_exact} is set is deferred to v1.7.
  quote_location:
    required: false
    range: string
    description: >-
      Free-form locator for the quote — paragraph id, XPath pointer,
      page-offset string, or W3C OA fragment IRI. Use when the structured
      `text_selector` / `fragment_selector` classes are overkill (e.g. the
      ASB adapter passes a `paragraph_id` string from its source paper).
  supports_claim:
    required: false
    range: Claim
    aliases: [for_claim]
    slot_uri: sepio:0000007
    description: >-
      Spec-required name for the SEPIO `is_evidence_for` relation. Aliases
      `for_claim`. ASB adapter targets this name. `sepio:0000007` is the
      SEPIO `is evidence for` predicate.
  eco_code:
    required: false
    range: EcoCodeAsbSubset
    description: >-
      ASB-subset ECO classification of this evidence line. Carries an
      ECO IRI via the enum's `meaning`. Coexists with `evidence_type`
      (broader, lifecycle-oriented): `eco_code` is the canonical
      ASB-emitted vocabulary, `evidence_type` remains for back-compat.
  confidence: { range: float }
  of_source:  { range: Source }
  for_claim:  { range: Claim }
  identifier: { required: true, slot_uri: dct:identifier }
  title:      { slot_uri: dct:title }
  authors:    { multivalued: true }
  license_id: {}
  doi:
    required: false
    slot_uri: dct:identifier
    description: >-
      DOI of this Source (paper, dataset, preprint). String form,
      no `doi:` prefix; canonical IRI is `https://doi.org/<value>`.
      Distinct from generic `identifier` so adapters can target it
      unambiguously.
  paragraph_id:
    required: false
    description: >-
      Stable per-paragraph identifier within the Source (e.g. the
      `id` attribute of a JATS `<p>` element, or an ASB-emitted
      `p-<n>` synthetic id). Pairs with `Evidence.quote_location`.
  xpath_pointer:
    required: false
    description: >-
      XPath expression locating a node within the Source's structured
      representation (JATS XML, TEI, HTML). Alternative to
      `paragraph_id` when finer granularity is needed.
  link_type:  { range: LinkType }
  # Figure-specific slots
  figure_id:        {}
  caption:          {}
  figure_type:      { range: FigureType }
  panel_label:      {}
  page:             { range: integer }
  media_type:       {}
  content_url:      {}
  source_doi:       {}
  is_supplementary: { range: boolean }
  of_figure:        { range: Figure }
  # Script-specific slots
  script_id:        {}
  script_type:      { range: ScriptType }
  language:         {}
  purpose:          {}
  repository_url:   {}
  commit_sha:       {}
  of_script:        { range: Script }
  # DataAsset-specific slots
  asset_id:         {}
  dataset_type:     { range: DatasetType }
  data_format:      {}
  accession:        {}
  repository:       {}
  n_samples:        { range: integer }
  of_dataset:       { range: DataAsset }
  # ClaimLink slots (Gap 1)
  from_claim:       { range: Claim }
  to_claim:         { range: Claim }
  # ClaimStatus slot (Gap 2)
  claim_status:     { range: ClaimStatus }
  # W3C OA selector slots (Gap 3)
  tqs_exact:        {}
  tqs_prefix:       {}
  tqs_suffix:       {}
  frag_value:       {}
  frag_page:        { range: integer }
  text_selector:    { range: TextQuoteSelector }
  fragment_selector: { range: FragmentSelector }
  # Universe-conditional scope (Gap 4)
  decision_context:
    multivalued: true
    pattern: "^[a-zA-Z_][a-zA-Z0-9_]*\\.[a-zA-Z_][a-zA-Z0-9_]*$"
    description: >-
      ASTRA-style 'decision_id.option_id' tags scoping this evidence item to a
      specific methodological universe. Empty list = universally applicable.
  # Agent attribution (Gap 5)
  asserted_by:
    slot_uri: prov:wasAttributedTo
    description: >-
      IRI or identifier of the agent (human ORCID, pipeline run ID, etc.) that
      asserted this item.
  # ASTRA bridge slot (Gap 6)
  astra_insight_ref:
    description: >-
      Reference to the originating ASTRA insight in 'analysis_id/insight_id' format.
  # Claim lineage slot (v1.4)
  superseded_by:
    range: uriorcurie
    required: false
    description: >-
      URI of the Claim that supersedes this one. Must be set when claim_status
      is 'superseded'. Allows external Claim IRIs for cross-document lineage.
  # IndiciumDocument collection slots (v1.4)
  claims:
    range: Claim
    multivalued: true
    inlined: true
    description: All Claim entities in this document.
  evidences:
    range: Evidence
    multivalued: true
    inlined: true
    description: All Evidence entities in this document.
  sources:
    range: Source
    multivalued: true
    inlined: true
    description: All Source entities in this document.
  figures:
    range: Figure
    multivalued: true
    inlined: true
    description: All Figure entities in this document.
  scripts:
    range: Script
    multivalued: true
    inlined: true
    description: All Script entities in this document.
  datasets:
    range: DataAsset
    multivalued: true
    inlined: true
    description: All DataAsset entities in this document.
  claim_links:
    range: ClaimLink
    multivalued: true
    inlined: true
    description: All ClaimLink edges in this document.
  citation_links:
    range: CitationLink
    multivalued: true
    inlined: true
    description: All CitationLink edges in this document.
  software_entities:
    range: SoftwareEntity
    multivalued: true
    inlined: true
    description: All SoftwareEntity records in this document.
  # SoftwareEntity-specific slots
  canonical_url:
    required: false
    range: uri
    description: Canonical homepage / source URL of the software entity.
  version:
    required: false
    description: Version string (e.g. SemVer, git tag, release name).
  edam_operation:
    required: false
    range: uriorcurie
    description: EDAM operation IRI (e.g. http://edamontology.org/operation_3215).
  edam_topics:
    required: false
    multivalued: true
    range: uriorcurie
    description: EDAM topic IRIs (multivalued).
  bio_tools_id:
    required: false
    description: bio.tools registry ID for cross-reference / federation.

classes:
  IndiciumDocument:
    tree_root: true
    description: >-
      Top-level container for a serialisable Indicium document.
      Holds all entity collections; enables full round-trip JSON/YAML/RDF I/O.
    slots:
      - claims
      - evidences
      - sources
      - figures
      - scripts
      - datasets
      - software_entities
      - claim_links
      - citation_links

  Claim:
    class_uri: asb:Claim
    description: A scientific claim using the Bucur 5-slot SuperPattern.
    slots:
      - id
      - context
      - subject
      - qualifier
      - super_pattern
      - domain_qualifier
      - relation
      - predicate
      - object
      - claim_type
      - source_excerpt
      - claim_status
      - asserted_by
      - astra_insight_ref
      - superseded_by
  Evidence:
    class_uri: sepio:0000002
    description: An evidence line linking a Claim to a Source (SEPIO EvidenceLine).
    slots: [evidence_type, eco_code, source_type, quote, quote_exact, quote_location,
            confidence, of_source, for_claim, supports_claim,
            of_figure, of_script, of_dataset, text_selector, fragment_selector,
            decision_context, asserted_by]
  Source:
    class_uri: fabio:Expression
    description: A cited source/paper with stable identity.
    slots: [identifier, doi, title, authors, license_id, paragraph_id, xpath_pointer]
  Figure:
    class_uri: doco:Figure
    description: >-
      A figure, table, or other display item from a scholarly publication.
      Carries optional FaBiO sub-type classification (via figure_type) and
      provenance (source_doi). Linked from Evidence.of_figure when the
      evidence is grounded in a visual artefact rather than a text passage.
    slots:
      - identifier
      - figure_id
      - caption
      - figure_type
      - panel_label
      - page
      - media_type
      - content_url
      - source_doi
      - is_supplementary
      - fragment_selector
    slot_usage:
      identifier:
        required: false
  Script:
    class_uri: fabio:ComputerProgram
    description: >-
      A code artefact (script, notebook, or pipeline) from a scholarly
      publication. Carries role classification (script_type), programming
      language, repository URL, and optional pinned commit. Linked from
      Evidence.of_script when the evidence is grounded in code rather than
      a text passage or figure.
    slots:
      - identifier
      - script_id
      - script_type
      - language
      - purpose
      - repository_url
      - content_url
      - commit_sha
      - source_doi
      - is_supplementary
    slot_usage:
      identifier:
        required: false
  DataAsset:
    class_uri: dcat:Dataset
    description: >-
      A data artefact (dataset, supplementary file, or public repository
      deposit) from a scholarly publication. Carries content-type
      classification (dataset_type), file format, accession number, and
      hosting repository. Linked from Evidence.of_dataset when the evidence
      is grounded in data rather than a text passage.
    slots:
      - identifier
      - asset_id
      - dataset_type
      - data_format
      - accession
      - repository
      - content_url
      - source_doi
      - n_samples
      - is_supplementary
    slot_usage:
      identifier:
        required: false
  SoftwareEntity:
    class_uri: fabio:ComputerProgram
    description: >-
      A software tool / package with stable identity, EDAM annotations,
      and optional bio.tools cross-reference. Distinct from `Script`
      (in-paper code artefact): SoftwareEntity is a globally identified
      tool (e.g. MZmine, OpenMS) that multiple papers may cite.
    slots:
      - identifier
      - canonical_url
      - version
      - edam_operation
      - edam_topics
      - bio_tools_id
    slot_usage:
      identifier:
        required: true
        description: >-
          Stable IRI (e.g. w3id.org/holobiomicslab/asb-tool/<slug>) or
          URN identifying the software entity.
  CitationLink:
    description: A typed link (CiTO) from a Source to a Claim.
    slots: [of_source, for_claim, link_type]
  ClaimLink:
    description: >-
      A typed semantic link between two Claims using CiTO predicates.
      Enables contradiction detection, argument graphs, and claim ledger navigation.
    slots: [from_claim, to_claim, link_type]
  TextQuoteSelector:
    class_uri: oa:TextQuoteSelector
    description: >-
      W3C TextQuoteSelector. Exact text + optional disambiguation context.
      Matches ASTRA's existing oa:TextQuoteSelector alignment.
    slots: [tqs_exact, tqs_prefix, tqs_suffix]
  FragmentSelector:
    class_uri: oa:FragmentSelector
    description: W3C FragmentSelector for PDF page location.
    slots: [frag_value, frag_page]
