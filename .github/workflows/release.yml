name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --extra codegen --extra docs

      - name: Check tag, version and release date
        run: uv run --frozen python scripts/check_release.py --tag "$GITHUB_REF_NAME" --notes-output release-notes.md

      - name: Check schema generation
        run: |
          make schema-assets
          git diff --exit-code -- src/indicium/generated src/indicium/schema/context.jsonld docs/schema-assets docs/changelog.md

      - name: Run tests and lint
        run: |
          uv run --frozen pytest -v
          make lint

      - name: Build documentation
        run: uv run --frozen mkdocs build --strict

      - name: Build and check distributions
        run: |
          uv pip install --python .venv/bin/python -r requirements-release.txt
          uv run --no-sync python -m build
          uv run --no-sync python -m twine check --strict dist/*

      - name: Check installed wheel
        run: |
          uv venv --python 3.12 .wheel-env
          uv pip install --python .wheel-env/bin/python dist/*.whl
          .wheel-env/bin/python scripts/check_wheel.py

      - uses: actions/upload-artifact@v7
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: release-documents
          path: |
            release-notes.md
            docs/schema-assets/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/indicium-standard
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-distributions
          path: dist

      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-distributions
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: release-documents
          path: release-documents

      - uses: softprops/action-gh-release@v3
        with:
          body_path: release-documents/release-notes.md
          files: |
            dist/*
            release-documents/docs/schema-assets/*
