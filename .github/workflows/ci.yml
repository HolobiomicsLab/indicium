name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --extra codegen

      - name: Run tests
        run: uv run --frozen pytest -v

      - name: Lint
        run: make lint

  wheel-smoke:
    # The codegen/dev extras pull pydantic in transitively, which hid a missing
    # runtime dependency. Install the wheel alone, exactly as a user would.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Build the wheel
        run: uv build --wheel

      - name: Install the wheel into a clean environment
        run: |
          uv venv --python 3.11 .wheel-env
          uv pip install --python .wheel-env/bin/python dist/*.whl

      - name: Import the package with no extras present
        run: |
          .wheel-env/bin/python -c "
          import indicium
          from indicium.generated.model import Claim
          from indicium.validate import validate_graph
          print('wheel imports cleanly')
          "

      # A dist rename silently breaks the importlib.metadata lookup: __version__
      # falls back to 0.0.0+unknown, or reports the squatting `indicium` package.
      - name: Report a truthful version and vocabulary base
        run: |
          .wheel-env/bin/python -c "
          import indicium, tomllib, pathlib
          expected = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          assert indicium.__version__ == expected, f'{indicium.__version__} != {expected}'
          assert indicium.ASB_BASE.startswith('https://'), indicium.ASB_BASE
          print(f'wheel reports {indicium.__version__} @ {indicium.ASB_BASE}')
          "

      - name: Validate a wheel sample and negative control
        run: .wheel-env/bin/python scripts/check_wheel.py

  docs:
    # The deploy runs only on main; build the site on every pull request too, so a
    # broken link or a Makefile that fails on Linux is caught before the merge.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --extra codegen --extra docs

      - name: Build schema artefacts and copy to docs
        run: make schema-assets

      - name: Build the site in strict mode
        run: uv run --frozen mkdocs build --strict
