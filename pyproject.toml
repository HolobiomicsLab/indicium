[project]
# Distribution name is `indicium-standard`; the import package stays `indicium`.
# The PyPI name `indicium` belongs to an unrelated, abandoned key-value-store
# package that also ships a top-level `indicium` module. Never install both.
name = "indicium-standard"
version = "2.0.0"
description = "Shared claim/evidence standard (ECO/CiTO/SEPIO/PROV-O + Bucur SuperPattern)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Louis-Félix Nothias", email = "louis-felix.nothias@cnrs.fr" }]
keywords = [
    "linkml", "claims", "evidence", "scientific-standard",
    "agentic-science", "eco", "cito", "sepio", "prov-o",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
# Runtime is intentionally light. `indicium/__init__.py` re-exports the generated
# pydantic model, so pydantic is a hard runtime dependency, not a dev-only one.
# `linkml` (the generator) and `linkml-runtime` (SchemaView) are needed ONLY for
# `make gen` and the schema-load tests — see the `codegen` extra.
dependencies = [
    "pydantic>=2.0",
    "pyshacl>=0.26",
    "rdflib>=7.0",
]

[project.urls]
Homepage = "https://holobiomicslab.github.io/indicium"
Documentation = "https://holobiomicslab.github.io/indicium/"
Repository = "https://github.com/HolobiomicsLab/indicium"
Issues = "https://github.com/HolobiomicsLab/indicium/issues"
Changelog = "https://holobiomicslab.github.io/indicium/changelog/"

[project.optional-dependencies]
codegen = [
    "linkml>=1.8",
    "linkml-runtime>=1.8",
    "pyyaml>=6.0",
]
astra = [
    "pyyaml>=6.0",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/indicium"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/LICENSE", "/CHANGELOG.md", "/pyproject.toml"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "linkml>=1.8",
    "linkml-runtime>=1.8",
    "pyyaml>=6.0",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "ruff>=0.12",
]

[tool.ruff]
extend-exclude = ["src/indicium/generated"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
