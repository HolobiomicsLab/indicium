site_name: Indicium
site_url: https://holobiomicslab.github.io/indicium
site_description: >-
  Indicium — the shared standard for typed scientific claims bound to their
  evidence. ECO / CiTO / SEPIO / PROV-O + Bucur SuperPattern.
site_author: HolobiomicsLab

repo_name: HolobiomicsLab/indicium
repo_url: https://github.com/HolobiomicsLab/indicium

docs_dir: docs
site_dir: site
exclude_docs: |
  superpowers/

theme:
  name: material
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - content.code.copy

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            show_category_heading: true
            docstring_style: google
            show_signature_annotations: true

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Schema:
    - Overview: schema/index.md
    - Claim: schema/claim.md
    - Evidence: schema/evidence.md
    - Source: schema/source.md
  - Adapters:
    - ASTRA: adapters/astra.md
    - SciTask: adapters/scitask.md
    - KGmemory: adapters/kgmemory.md
  - API Reference: api-reference.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true
