site_name: Indicium
site_url: https://holobiomicslab.github.io/indicium
site_description: >-
  Indicium, a standard for typed scientific claims bound to their evidence.
  ECO, CiTO, SEPIO and PROV-O with the Bucur SuperPattern.
site_author: Holobiomics Lab

repo_name: HolobiomicsLab/indicium
repo_url: https://github.com/HolobiomicsLab/indicium

docs_dir: docs
site_dir: site
# release/ holds files meant for other repositories (the w3id request); it does
# not belong on the site.
exclude_docs: |
  release/

theme:
  name: material
  # Brand files: docs/assets/brand/. The header is CNRS blue in both schemes,
  # so it takes the light-on-dark variant of the mark.
  logo: assets/brand/indicium-mark-dark.svg
  favicon: assets/brand/indicium-mark-512.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.integrate
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            show_category_heading: true
            docstring_style: google
            show_signature_annotations: true

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Schema:
    - Overview: schema/index.md
    - Claim: schema/claim.md
    - Evidence: schema/evidence.md
    - Source: schema/source.md
  - Adapters:
    - ASTRA: adapters/astra.md
    - SciTask: adapters/scitask.md
    - KGmemory: adapters/kgmemory.md
  - Reference:
    - URI scheme: uri-scheme.md
    - SEPIO assertion pattern: sepio-assertion.md
    - Kernel contract: kernel-contract.md
  - API Reference: api-reference.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true
